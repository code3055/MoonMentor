name: Verify MoonMentor

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  moonbit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install MoonBit
        shell: bash
        run: curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
      - name: Add MoonBit to PATH
        run: echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Format check
        run: moon fmt --check
      - name: Type and package check
        run: moon check
      - name: Build
        run: moon build
      - name: Build browser bridge
        run: moon build --target js --release web/bridge
      - name: Test
        run: moon test
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test browser integration
        run: |
          cp _build/js/release/build/web/bridge/bridge.js web/bridge.js
          node --test web/app.test.mjs
      - name: Run example
        run: moon run cmd/moonmentor
